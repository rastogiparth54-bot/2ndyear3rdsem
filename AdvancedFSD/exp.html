<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f6f7fb; }
        h1 { text-align: center; }
        section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 18px; }
        h2 { margin-top: 0; font-size: 18px; color: #333; }
        button { margin: 4px 6px 4px 0; padding: 8px 14px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; cursor: pointer; }
        button:hover { background: #4338ca; }
        input { padding: 7px; border: 1px solid #ccc; border-radius: 6px; margin-right: 6px; }
        pre { background: #111; color: #7fffa0; padding: 10px; border-radius: 6px; overflow-x: auto; min-height: 20px; }
        #log { background: #222; color: #ddd; font-size: 13px; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
    <section>
        <h2>2️⃣ DOM-like Event Handling (in the browser)</h2>
        <button id="domBtn">Click me</button>
        <pre id="domOutput"></pre>
    </section>

    
</body>
</html>
